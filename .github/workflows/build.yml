name: Build

on:
  push:
    branches:
      - master
      - client-only
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - client-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        shell: bash
        run: |
          status=0
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            ./gradlew build --stacktrace -Pci=true && exit 0
            status=$?

            echo "Gradle build failed with exit code ${status}"
            if [ "$attempt" -lt 3 ]; then
              echo "Cleaning partial Gradle downloads before retry"
              find "$HOME/.gradle/caches" -name "*.part" -delete 2>/dev/null || true
              find "$HOME/.gradle/caches" -name "*.tmp" -delete 2>/dev/null || true
              sleep $((attempt * 20))
            fi
          done
          exit "$status"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: emilink-client-only-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          MINECRAFT_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          EXPECTED_TAG="v${MOD_VERSION}-${MINECRAFT_VERSION}"

          if ! echo "$TAG" | grep -Eq '^v[0-9A-Za-z.+_-]+-[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Tag must match v{mod_version}-{minecraft_version}, got: $TAG"
            exit 1
          fi

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag does not match gradle.properties: expected $EXPECTED_TAG, got $TAG"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
