plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

def ciProperty = providers.gradleProperty('ci').map { it.toBoolean() }.orElse(false).get()
def isCiBuild = ciProperty || System.getenv('CI') == 'true'

repositories {
    mavenLocal()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'AE2 Maven'
        url = 'https://maven.appliedenergistics.org/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def optionalRuntime = { String localPath, String mavenNotation ->
    def localFile = file(localPath)
    if (!isCiBuild && localFile.exists()) {
        dependencies.add('runtimeOnly', files(localFile))
    } else {
        dependencies.add('runtimeOnly', mavenNotation)
    }
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    optionalRuntime('libs/1-21-1/extendedae_plus-1.21.1-1.5.4.jar',
            "maven.modrinth:extendedae-plus:${extendedae_plus_version}")
    optionalRuntime('../BeyondDimensions/beyonddimensions-1.21.1-neoforge-0.7.14.jar',
            "maven.modrinth:beyonddimensions:${beyonddimensions_version}")
    optionalRuntime('run/mods/ars_nouveau-1.21.1-5.11.7.jar',
            "maven.modrinth:ars-nouveau:${ars_nouveau_version}")
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('generateModMetadata') {
    outputs.upToDateWhen { false }
}

tasks.named('jar', Jar) {
    archiveBaseName.set(project.mod_id)
    archiveVersion.set("v${project.mod_version}-${project.minecraft_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
