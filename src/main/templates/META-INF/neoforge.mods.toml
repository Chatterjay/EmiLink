modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "emilink.png"

[[mixins]]
config = "${mod_id}.mixins.json"

# Optional config: a target class that another mod already loaded (AE2 and its
# addons probe EMI classes very early) then skips only this mixin instead of
# aborting startup.
[[mixins]]
config = "${mod_id}_emi_api.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "emi"
type = "required"
ordering = "NONE"
side = "BOTH"
